<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇趣游园会 · 向导上岗</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/game.css"></head>
<body class="login-page"><main class="login-shell"><section class="login-art" aria-label="奇趣小镇画面"><div class="login-art-image"></div><div class="login-art-copy"><span class="eyebrow">五年级 · 身边的算法 · 第4课</span><h1>奇趣<br>游园会</h1><p>今天，你是小镇向导。让每位游客找到想去的地方。</p></div><img class="login-guide" src="/assets/guide.webp" alt="热情的小镇向导"></section><section class="login-form-wrap"><div class="ticket-top">向导通行证 <span aria-hidden="true">✦</span></div><form id="login-form" class="login-card"><h2>先来认识你</h2><p>选择班级和姓名，就能接着上次的游园记录继续。</p><label for="class-select">班级</label><select id="class-select" required><option value="">请选择班级</option></select><label for="name-search">找姓名</label><input id="name-search" type="search" placeholder="输入姓名搜索本班名单" autocomplete="off"><label for="student-select">姓名</label><select id="student-select"><option value="">先选班级</option></select><div class="manual-row"><label><input type="checkbox" id="manual-toggle"> 名单里没有我，手动填写</label></div><div id="manual-field" hidden><label for="manual-name">填写姓名</label><input id="manual-name" maxlength="30" autocomplete="name" placeholder="请填写自己的姓名"></div><div id="identity-preview" class="identity-preview">请选择班级与姓名</div><p id="login-error" class="form-error" role="alert"></p><button class="primary-button full" type="submit">领取向导证，进入小镇 <span aria-hidden="true">→</span></button><small>这是课堂身份选择；请核对姓名后进入。</small></form><div class="ticket-bottom">活动完成获得印章与积分 · 学习记录自动保存</div></section></main><script src="/login.js" defer></script></body></html>
