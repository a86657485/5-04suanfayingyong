<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇趣游园会 · 小镇向导</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/game.css"></head><body class="game-page">
<header class="topbar"><div class="brand"><span class="brand-star">✦</span><div><strong>奇趣游园会</strong><small>今天你是小镇向导</small></div></div><div class="topbar-right"><span id="student-name" class="student-pill">正在进入小镇…</span><span id="points-pill" class="points-pill">印章积分 0</span><span id="save-status" class="save-status" role="status">连接中</span><button id="switch-student" class="text-button" type="button">切换学生</button></div></header>
<main class="game-layout"><section class="map-column"><div class="scene-header"><div><span class="eyebrow">奇趣小镇 · 算法路径地图</span><h1 id="map-title">寻找需要帮助的游客</h1></div><span id="stage-count" class="chapter-count">1 / 4</span></div><div class="map-scene" id="map-scene"><div class="map-fallback" aria-hidden="true"><span>识别馆</span><span>路径馆</span><span>推荐馆</span><span>搜索馆</span><span>游园入口</span></div><img class="map-image" src="/assets/game-map-paths.webp" alt="有三条不同颜色路径和分叉节点的游园小镇地图">
<svg id="route-layer" class="route-layer" viewBox="0 0 100 56" preserveAspectRatio="none" aria-hidden="true"></svg>
<button class="hotspot search-spot" data-stage="search" aria-label="前往搜索馆">⌕ <span>搜索馆</span></button><button class="hotspot nav-spot" data-stage="nav" aria-label="前往路径馆">✦ <span>路径馆</span></button><button class="hotspot reco-spot" data-stage="reco" aria-label="前往推荐馆">✧ <span>推荐馆</span></button><button class="hotspot service-spot" data-stage="service" aria-label="前往我的服务亭">✎ <span>服务亭</span></button>
<button class="hall-hotspot recognition-hall" data-hall="recognition" aria-label="前往图像识别馆" title="图像识别馆">叶</button><button class="hall-hotspot translation-hall" data-hall="translation" aria-label="前往语言翻译馆" title="语言翻译馆">译</button><button class="hall-hotspot shopping-hall" data-hall="shopping" aria-label="前往购物推荐馆" title="购物推荐馆">购</button><button class="hall-hotspot sports-hall" data-hall="sports" aria-label="前往运动数据馆" title="运动数据馆">动</button><button class="hall-hotspot art-hall" data-hall="art" aria-label="前往图像艺术馆" title="图像艺术馆">艺</button><button class="hall-hotspot medical-hall" data-hall="medical" aria-label="前往影像辅助馆" title="影像辅助馆">影</button>
<div id="scene-speech" class="scene-speech" hidden></div>
<img id="guide-avatar" class="map-character guide-avatar" src="/assets/guide.webp" alt="向导在小镇中"><img id="visitor-avatar" class="map-character visitor-avatar" src="/assets/visitor.webp" alt="等待帮助的游客"><div id="walk-marker" class="walk-marker" hidden aria-hidden="true"></div><img id="booth-asset" class="booth-asset" src="/assets/service-booth.webp" alt="你的智慧服务亭" hidden><div id="booth-badge" class="booth-badge" hidden></div><div id="barrier" class="barrier" aria-label="中心路封闭" hidden>🚧</div><div class="map-caption">点击道路，向导会走过去；点击地点可前往任务地点。</div></div><div class="stage-tabs" id="stage-tabs"></div></section>
<aside class="mission-column"><div class="mission-heading"><span class="eyebrow" id="mission-eyebrow">游客委托</span><h2 id="mission-title">准备接待游客</h2><p id="mission-intro">请先观察游客的需要。</p></div><div id="mission-content" class="mission-content"></div><div id="feedback" class="feedback-box" role="status" aria-live="polite">从游客的需要出发，作出你的决定。</div><details class="hint-panel" id="hint-panel"><summary>需要一点帮助？</summary><div id="hint-content"></div></details><div class="mission-foot"><button id="export-record" class="secondary-button" type="button">导出当前记录</button><span>遇到困难可以回看任务，不扣积分。</span></div></aside></main>
<script src="/gallery-model.cjs"></script><script src="/game-rules.cjs"></script><script src="/vendor/easystar.js"></script><script src="/walk-map.cjs"></script><script src="/walk.js"></script><script src="/gallery-ui.js"></script><script src="/game.js" defer></script></body></html>
