<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奇趣游园会 · 教师学习大屏</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/game.css"><link rel="stylesheet" href="/page-guide.css"><link rel="stylesheet" href="/teacher-charts.css"><link rel="stylesheet" href="/teacher.css"></head>
<body class="teacher-page" data-guide-page="teacher"><main class="document-shell teacher-shell">
<header class="document-header teacher-header">
<div class="teacher-heading-row"><div><span class="eyebrow">五年级 · 第4课 · 算法应用在身边</span><h1>奇趣游园会 · 班级学习大屏</h1><p>看见学习进度，依据回答与作品安排指导。</p></div>
<div class="teacher-controls"><label for="teacher-class">班级</label><select id="teacher-class"><option value="501">501班</option><option value="502">502班</option><option value="503">503班</option><option value="504">504班</option></select><button class="secondary-button" id="refresh-teacher" type="button">立即更新</button><button class="secondary-button" id="teacher-fullscreen" type="button">全屏展示</button></div></div>
<div class="teacher-heading-bottom"><div class="teacher-tabs" role="tablist" aria-label="大屏视图"><button class="teacher-tab" type="button" id="teacher-overview-tab" role="tab" aria-selected="true" aria-controls="teacher-overview" data-teacher-view="overview">图表总览</button><button class="teacher-tab" type="button" id="teacher-students-tab" role="tab" aria-selected="false" aria-controls="teacher-students" data-teacher-view="students">学生明细</button></div><div class="teacher-tools"><a class="text-button" href="/demo" target="_blank">隔离演示</a><button class="text-button" id="show-answers" type="button">查看答案与量规</button></div></div>
<p id="teacher-sync" class="small-note" role="status">正在读取课堂数据…</p>
</header>
<section id="teacher-overview" role="tabpanel" aria-labelledby="teacher-overview-tab">
<div id="teacher-metrics" class="metric-grid teacher-metrics" aria-label="班级概况"></div>
<div id="teacher-charts" class="teacher-chart-board" aria-label="班级学习图表"><p class="teacher-loading">正在汇总当前班级的学习记录…</p></div>
<p id="stage-metrics" class="teacher-stat-note"></p>
</section>
<section id="teacher-students" role="tabpanel" aria-labelledby="teacher-students-tab" hidden>
<section class="document-card teacher-student-card"><div class="teacher-list-heading"><h2>学生进度与学习记录</h2><div class="teacher-controls"><label class="teacher-search-label" for="teacher-search">查找学生</label><input type="search" id="teacher-search" placeholder="按姓名查找"><label><input type="checkbox" id="only-unfinished"> 只看未完成主线</label></div></div>
<div class="teacher-table-scroll"><table class="teacher-table"><thead><tr><th>学生</th><th>当前任务</th><th>找活动</th><th>带游客</th><th>推荐</th><th>服务卡</th><th>必做进度</th><th>活动积分</th><th>20题考核</th><th>最近同步</th><th>详情</th></tr></thead><tbody id="teacher-rows"></tbody></table></div></section>
<section class="document-card"><h2>个人学习证据</h2><div id="teacher-detail" class="teacher-detail">点击学生的“查看”按钮，阅读首次选择、修订和作品。</div></section>
</section>
<section class="document-card" id="answer-panel" hidden><h2>考核答案与服务卡量规</h2><div id="answer-content"></div></section>
</main><script src="/page-guide.js" defer></script><script src="/teacher-analytics.cjs" defer></script><script src="/teacher-charts.js" defer></script><script src="/teacher.js" defer></script></body></html>
