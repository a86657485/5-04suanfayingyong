<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
 <title id="title">购物推荐：根据浏览次数排序</title>
 <desc id="desc">科学实验盒浏览3次，跳绳1次，水彩笔4次，按次数从多到少，推荐顺序为水彩笔、科学实验盒、跳绳。过去记录不等于今天需要。</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#9d6424"/></marker></defs>
 <rect width="960" height="440" rx="22" fill="#fff9f0"/>
 <g font-family="sans-serif" font-size="24" fill="#503b24">
  <text x="28" y="40" font-size="28" font-weight="700">购物推荐：同一份记录怎样变成推荐清单？</text>
  <text x="32" y="87" font-weight="700">① 输入：浏览记录</text><text x="346" y="87" font-weight="700">② 处理：按次数排序</text><text x="681" y="87" font-weight="700">③ 结果：推荐清单</text>
  <g id="input">
   <rect x="28" y="115" width="265" height="250" rx="16" fill="#fff" stroke="#ead0a8" stroke-width="2"/>
   <text x="42" y="151" font-size="22">商品</text><text x="202" y="151" font-size="22">次数</text>
   <path d="M42 164H277" stroke="#dfc69f" stroke-width="2"/>
   <text x="42" y="211" font-size="22">科学实验盒</text><text x="230" y="211">3</text>
   <text x="42" y="270" font-size="22">跳绳</text><text x="230" y="270">1</text>
   <text x="42" y="329" font-size="22">水彩笔</text><text x="230" y="329">4</text>
  </g>
  <path d="M302 238H330" stroke="#9d6424" stroke-width="4" marker-end="url(#arrow)"/>
  <g id="process">
   <rect x="344" y="115" width="281" height="250" rx="16" fill="#fff" stroke="#ead0a8" stroke-width="2"/>
   <text x="359" y="149" font-size="22">柱越长，浏览次数越多</text>
   <path d="M441 177V328H603" fill="none" stroke="#9d6424" stroke-width="2"/>
   <text x="357" y="204" font-size="22">实验盒</text><rect class="browse-bar" data-product="science" data-count="3" x="442" y="182" width="90" height="29" rx="5" fill="#6d9bb5"/><text x="542" y="205" font-size="22">3</text>
   <text x="381" y="257" font-size="22">跳绳</text><rect class="browse-bar" data-product="sport" data-count="1" x="442" y="235" width="30" height="29" rx="5" fill="#8db69a"/><text x="482" y="258" font-size="22">1</text>
   <text x="357" y="310" font-size="22">水彩笔</text><rect class="browse-bar" data-product="art" data-count="4" x="442" y="288" width="120" height="29" rx="5" fill="#d29753"/><text x="572" y="311" font-size="22">4</text>
   <text x="423" y="354" font-size="22">从多到少：4＞3＞1</text>
  </g>
  <path d="M634 238H666" stroke="#9d6424" stroke-width="4" marker-end="url(#arrow)"/>
  <g id="output">
   <g class="rank-row" data-product="art"><rect x="681" y="115" width="251" height="68" rx="12" fill="#fae8c9"/><circle cx="709" cy="149" r="18" fill="#b87823"/><text x="703" y="157" fill="#fff" font-size="22">1</text><text x="743" y="157">水彩笔</text></g>
   <g class="rank-row" data-product="science"><rect x="681" y="194" width="251" height="68" rx="12" fill="#f6eddd"/><circle cx="709" cy="228" r="18" fill="#8c7757"/><text x="703" y="236" fill="#fff" font-size="22">2</text><text x="743" y="236" font-size="22">科学实验盒</text></g>
   <g class="rank-row" data-product="sport"><rect x="681" y="273" width="251" height="68" rx="12" fill="#f6eddd"/><circle cx="709" cy="307" r="18" fill="#8c7757"/><text x="703" y="315" fill="#fff" font-size="22">3</text><text x="743" y="315">跳绳</text></g>
   <text x="707" y="372" font-size="22">今天需要吗？自己核对</text>
  </g>
  <text x="30" y="413" font-size="22">教学简化：只按 0—5 次浏览记录排序；推荐靠前不代表今天一定想买。</text>
 </g>
</svg>
