<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
 <title id="title">像素反色：每个RGB颜色值用255减原值</title>
 <desc id="desc">九个像素组成原图。一个像素RGB120、60、30分别用255减后为135、195、225。对所有像素逐个使用同一规则，得到九格反色新图。</desc>
 <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#705391"/></marker></defs>
 <rect width="960" height="440" rx="22" fill="#fbf7ff"/>
 <g font-family="sans-serif" font-size="24" fill="#49395f">
  <text x="28" y="40" font-size="28" font-weight="700">图像艺术：一个像素怎样变成反色？</text>
  <text x="31" y="87" font-weight="700">① 输入：像素颜色</text><text x="345" y="87" font-weight="700">② 处理：逐个计算</text><text x="685" y="87" font-weight="700">③ 结果：反色新图</text>
  <g id="input">
   <rect x="28" y="115" width="258" height="250" rx="16" fill="#fff" stroke="#d8c8e7" stroke-width="2"/>
   <g stroke="#fff" stroke-width="3">
    <rect class="original-pixel" x="69" y="142" width="57" height="57" fill="rgb(120,60,30)"/><rect class="original-pixel" x="126" y="142" width="57" height="57" fill="rgb(40,140,200)"/><rect class="original-pixel" x="183" y="142" width="57" height="57" fill="rgb(240,190,50)"/>
    <rect class="original-pixel" x="69" y="199" width="57" height="57" fill="rgb(70,180,90)"/><rect class="original-pixel" x="126" y="199" width="57" height="57" fill="rgb(160,70,170)"/><rect class="original-pixel" x="183" y="199" width="57" height="57" fill="rgb(220,110,80)"/>
    <rect class="original-pixel" x="69" y="256" width="57" height="57" fill="rgb(20,40,90)"/><rect class="original-pixel" x="126" y="256" width="57" height="57" fill="rgb(210,225,240)"/><rect class="original-pixel" x="183" y="256" width="57" height="57" fill="rgb(0,0,0)"/>
   </g>
   <rect x="68" y="141" width="59" height="59" fill="none" stroke="#513b6b" stroke-width="4"/>
   <text x="77" y="346" font-size="22">放大左上角像素 →</text>
  </g>
  <path d="M296 238H329" stroke="#705391" stroke-width="4" marker-end="url(#arrow)"/>
  <g id="process">
   <rect x="343" y="115" width="281" height="250" rx="16" fill="#fff" stroke="#d8c8e7" stroke-width="2"/>
   <rect id="pixel-input" data-rgb="120,60,30" x="359" y="139" width="42" height="42" rx="7" fill="rgb(120,60,30)"/><text x="411" y="167" font-size="22">RGB：120, 60, 30</text>
   <text x="362" y="210" font-size="22">红：255 − 120 = 135</text>
   <text x="362" y="246" font-size="22">绿：255 − 60 = 195</text>
   <text x="362" y="282" font-size="22">蓝：255 − 30 = 225</text>
   <rect id="pixel-output" data-rgb="135,195,225" x="359" y="308" width="42" height="42" rx="7" fill="rgb(135,195,225)"/><text x="411" y="337" font-size="22">新值：135,195,225</text>
  </g>
  <path d="M633 238H666" stroke="#705391" stroke-width="4" marker-end="url(#arrow)"/>
  <g id="output">
   <rect x="681" y="115" width="251" height="250" rx="16" fill="#fff" stroke="#d8c8e7" stroke-width="2"/>
   <g stroke="#fff" stroke-width="3">
    <rect class="inverted-pixel" x="720" y="142" width="57" height="57" fill="rgb(135,195,225)"/><rect class="inverted-pixel" x="777" y="142" width="57" height="57" fill="rgb(215,115,55)"/><rect class="inverted-pixel" x="834" y="142" width="57" height="57" fill="rgb(15,65,205)"/>
    <rect class="inverted-pixel" x="720" y="199" width="57" height="57" fill="rgb(185,75,165)"/><rect class="inverted-pixel" x="777" y="199" width="57" height="57" fill="rgb(95,185,85)"/><rect class="inverted-pixel" x="834" y="199" width="57" height="57" fill="rgb(35,145,175)"/>
    <rect class="inverted-pixel" x="720" y="256" width="57" height="57" fill="rgb(235,215,165)"/><rect class="inverted-pixel" x="777" y="256" width="57" height="57" fill="rgb(45,30,15)"/><rect class="inverted-pixel" x="834" y="256" width="57" height="57" fill="rgb(255,255,255)"/>
   </g>
   <rect x="719" y="141" width="59" height="59" fill="none" stroke="#513b6b" stroke-width="4"/>
   <text x="713" y="346" font-size="22">每个像素都用同一规则</text>
  </g>
  <text x="30" y="413" font-size="22">RGB 三个值分别表示红、绿、蓝，范围 0—255；新值 = 255 − 原值。</text>
 </g>
</svg>
