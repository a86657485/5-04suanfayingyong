 <title id="title">虚构亮度格：达到阈值的格子只作复核提示</title>
 <desc id="desc">8乘8虚构亮度格，阈值8，亮度大于等于8的四格被框出，交专业人员复核。亮点不等于病变，本馆不能用于医疗判断。</desc>
